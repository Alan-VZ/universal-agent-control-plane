name: Feature request
description: Propose a focused capability or compatibility improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What limitation or workflow problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired behavior and affected agent hosts.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative designs you considered.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not require bypassing a host's safety or approval controls.
          required: true
        - label: I searched existing issues for a similar request.
          required: true
