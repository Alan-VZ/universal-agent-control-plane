[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-agent-control-plane"
version = "0.1.0"
description = "Shared instructions, Agent Skills, prompts, tools, and state for MCP-compatible agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Alan Van Zandt" },
]
keywords = [
  "agent-skills",
  "claude-code",
  "github-copilot",
  "mcp",
  "model-context-protocol",
  "vscode",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.116,<1",
  "mcp>=2.0.0,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.35,<1",
]

[project.urls]
Homepage = "https://github.com/Alan-VZ/universal-agent-control-plane"
Documentation = "https://github.com/Alan-VZ/universal-agent-control-plane#readme"
Issues = "https://github.com/Alan-VZ/universal-agent-control-plane/issues"
Source = "https://github.com/Alan-VZ/universal-agent-control-plane"

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
]

[project.scripts]
uacp = "universal_agent_control_plane.cli:main"
universal-agent-control-plane = "universal_agent_control_plane.server:main"
universal-agent-control-plane-api = "universal_agent_control_plane.api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_agent_control_plane"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
